<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --h:          #3d7fff;
  --h-dim:      rgba(61,127,255,.18);
  --h-glow:     rgba(61,127,255,.35);
  --j:          #ff3d3d;
  --j-dim:      rgba(255,61,61,.18);
  --j-glow:     rgba(255,61,61,.35);
  --bg:         #0a0a0a;
  --surface:    #111;
  --rim:        rgba(255,255,255,.07);
  --rim-strong: rgba(255,255,255,.13);
  --text:       #f2f2f2;
  --sub:        rgba(242,242,242,.4);
  --gold:       #f5c842;
}

html { height: 100%; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  user-select: none;
}

/* ═══════════════════════════════════════════
   CANVAS (background particles)
═══════════════════════════════════════════ */
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.header {
  position: relative;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 0;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
}

.wordmark {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: .82rem;
  letter-spacing: .12em;
  color: var(--sub);
  text-transform: uppercase;
}

.connection {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: .72rem;
  color: var(--sub);
  font-weight: 500;
}

.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #333;
  transition: background .4s, box-shadow .4s;
}
.dot.live    { background: #3dff7f; box-shadow: 0 0 8px #3dff7f; }
.dot.offline { background: var(--j); }

/* ═══════════════════════════════════════════
   LEAD BAR
═══════════════════════════════════════════ */
.lead-bar-wrap {
  position: relative;
  z-index: 20;
  padding: 14px 18px 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.lead-label {
  display: flex;
  justify-content: space-between;
  font-size: .68rem;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: .04em;
}

.lead-track {
  height: 4px;
  background: var(--rim);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.lead-fill {
  position: absolute;
  top: 0; bottom: 0;
  transition: left .4s cubic-bezier(.22,1,.36,1), right .4s cubic-bezier(.22,1,.36,1), background .4s;
  border-radius: 2px;
}

/* ═══════════════════════════════════════════
   SCOREBOARD
═══════════════════════════════════════════ */
.board {
  position: relative;
  z-index: 20;
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 40px 1fr;
  min-height: 0;
  padding: 8px 0 0;
}

.side {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 16px 12px;
}

/* per-side ambient glow */
.side.h { background: radial-gradient(ellipse 80% 60% at 50% 55%, var(--h-dim), transparent 70%); }
.side.j { background: radial-gradient(ellipse 80% 60% at 50% 55%, var(--j-dim), transparent 70%); }

/* ripple canvas per side */
.side canvas {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

.p-name {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: clamp(.72rem, 3.2vw, .9rem);
  letter-spacing: .06em;
  position: relative;
  z-index: 2;
  margin-bottom: 6px;
}

.side.h .p-name { color: var(--h); }
.side.j .p-name { color: var(--j); }

/* Flip-digit score */
.score-wrap {
  position: relative;
  z-index: 2;
  perspective: 600px;
}

.score-digit {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: clamp(6.5rem, 24vw, 10.5rem);
  line-height: 1;
  letter-spacing: -.04em;
  display: block;
  transform-origin: center bottom;
  transition: transform .12s ease, opacity .12s ease;
  will-change: transform;
}

.score-digit.flip-out {
  animation: flipOut .13s ease forwards;
}
.score-digit.flip-in {
  animation: flipIn .13s ease forwards;
}

@keyframes flipOut {
  to { transform: rotateX(90deg) scaleY(.8); opacity: 0; }
}
@keyframes flipIn {
  from { transform: rotateX(-90deg) scaleY(.8); opacity: 0; }
  to   { transform: rotateX(0) scaleY(1); opacity: 1; }
}

.side.h .score-digit { color: var(--text); text-shadow: 0 0 60px var(--h-glow); }
.side.j .score-digit { color: var(--text); text-shadow: 0 0 60px var(--j-glow); }

/* Goal dots */
.goals-pip {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px;
  max-width: 120px;
  margin-top: 10px;
  min-height: 12px;
}

.pip {
  width: 8px; height: 8px;
  border-radius: 50%;
  opacity: .5;
  transition: opacity .2s, transform .2s;
}

.pip.active { opacity: 1; transform: scale(1.2); }

.side.h .pip { background: var(--h); }
.side.j .pip { background: var(--j); }

/* center divider */
.center-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 20;
}

.vs-text {
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  font-size: .65rem;
  color: var(--sub);
  letter-spacing: .1em;
}

.center-line {
  width: 1px;
  flex: 1;
  background: var(--rim);
  max-height: 60px;
}

/* ═══════════════════════════════════════════
   GOAL BUTTONS — big tactile zones
═══════════════════════════════════════════ */
.controls {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--rim);
}

.ctrl {
  display: flex;
  flex-direction: column;
}

.ctrl.h { border-right: 1px solid var(--rim); }

.btn-goal {
  border: none;
  background: transparent;
  font-family: 'Unbounded', sans-serif;
  font-weight: 900;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 20px;
  border-bottom: 1px solid var(--rim);
}

.btn-goal:last-child { border-bottom: none; }

.btn-goal .btn-label {
  font-size: clamp(1rem, 4.5vw, 1.3rem);
  letter-spacing: -.02em;
  position: relative;
  z-index: 1;
}

.btn-goal .btn-sub {
  font-family: 'Inter', sans-serif;
  font-size: .65rem;
  font-weight: 500;
  letter-spacing: .05em;
  color: var(--sub);
  position: relative;
  z-index: 1;
}

/* Ripple on tap */
.btn-goal::before {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  transition: opacity .12s;
}
.btn-goal:active::before { opacity: .07; }

.ctrl.h .btn-goal.plus  .btn-label { color: var(--h); font-size: clamp(1.3rem, 5.5vw, 1.7rem); }
.ctrl.h .btn-goal.minus .btn-label { color: var(--sub); }
.ctrl.j .btn-goal.plus  .btn-label { color: var(--j); font-size: clamp(1.3rem, 5.5vw, 1.7rem); }
.ctrl.j .btn-goal.minus .btn-label { color: var(--sub); }

/* ═══════════════════════════════════════════
   STATS BAR
═══════════════════════════════════════════ */
.stats-row {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid var(--rim);
  border-bottom: 1px solid var(--rim);
}

.stat-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 6px;
  border-right: 1px solid var(--rim);
  gap: 2px;
}

.stat-cell:last-child { border-right: none; }

.stat-val {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: clamp(.85rem, 3.5vw, 1.05rem);
}

.stat-label {
  font-size: .6rem;
  font-weight: 500;
  color: var(--sub);
  letter-spacing: .05em;
  text-align: center;
}

.stat-val.h { color: var(--h); }
.stat-val.j { color: var(--j); }
.stat-val.neutral { color: var(--sub); }

/* ═══════════════════════════════════════════
   ACTION ROW
═══════════════════════════════════════════ */
.actions {
  position: relative;
  z-index: 20;
  display: flex;
  border-bottom: 1px solid var(--rim);
}

.act-btn {
  flex: 1;
  border: none;
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: .72rem;
  letter-spacing: .03em;
  color: var(--sub);
  padding: 12px 6px;
  cursor: pointer;
  border-right: 1px solid var(--rim);
  transition: color .15s, background .15s;
}

.act-btn:last-child { border-right: none; }
.act-btn:active { background: var(--rim); color: var(--text); }
.act-btn.gold { color: var(--gold); }
.act-btn.gold:active { color: #ffd84a; }

/* ═══════════════════════════════════════════
   HISTORY
═══════════════════════════════════════════ */
.hist-toggle {
  position: relative;
  z-index: 20;
  width: 100%;
  border: none;
  background: transparent;
  color: var(--sub);
  font-family: 'Inter', sans-serif;
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .06em;
  padding: 10px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--rim);
  text-transform: uppercase;
  transition: color .15s;
}

.hist-toggle:hover { color: var(--text); }

.hist-arrow {
  font-style: normal;
  display: inline-block;
  transition: transform .22s cubic-bezier(.22,1,.36,1);
}

.hist-toggle.open .hist-arrow { transform: rotate(180deg); }

.hist-panel {
  position: relative;
  z-index: 20;
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s cubic-bezier(.22,1,.36,1);
}

.hist-panel.open { max-height: 300px; overflow-y: auto; }

.hist-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--rim);
  font-size: .8rem;
}

.hist-score-text {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: .9rem;
  color: var(--text);
}

.hist-win {
  font-size: .7rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 3px;
}

.hist-win.h { background: var(--h-dim); color: var(--h); }
.hist-win.j { background: var(--j-dim); color: var(--j); }
.hist-win.draw { background: var(--rim); color: var(--sub); }

.hist-time-text { font-size: .68rem; color: var(--sub); text-align: right; }

.hist-empty {
  padding: 20px 16px;
  text-align: center;
  color: var(--sub);
  font-size: .8rem;
}


/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--text);
  color: var(--bg);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: .82rem;
  padding: 8px 16px;
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  z-index: 600;
  white-space: nowrap;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- HEADER -->
<div class="header">
  <span class="wordmark">Kicker</span>
  <div class="connection">
    <div class="dot" id="dot"></div>
    <span id="connLabel">…</span>
  </div>
</div>

<!-- LEAD BAR -->
<div class="lead-bar-wrap">
  <div class="lead-label">
    <span id="leadH" style="color:var(--h)">Hendrik</span>
    <span id="leadText" style="color:var(--sub)">0 : 0</span>

  </div>
  <div class="lead-track">
    <div class="lead-fill" id="leadFill" style="left:50%;right:50%;background:var(--rim)"></div>

<!-- BOARD -->
<div class="board">
  <div class="side h">
    <canvas id="rippleH"></canvas>
    <div class="p-name">Hendrik</div>
    <div class="score-wrap">
      <span class="score-digit" id="scoreH">0</span>

  <div class="center-col">

  <div class="side j">
    <canvas id="rippleJ"></canvas>
    <div class="p-name">Jakob</div>

      <span class="score-digit" id="scoreJ">0</span>
    </div>

</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="ctrl h">
    <button class="btn-goal plus" onclick="changeScore('h',1)">
      <span class="btn-label">+1</span>
      <span class="btn-sub">Tor</span>
    </button>
    <button class="btn-goal minus" onclick="changeScore('h',-1)">
      <span class="btn-label">−1</span>
      <span class="btn-sub">Korrektur</span>
    </button>
  </div>
  <div class="ctrl j">
    <button class="btn-goal plus" onclick="changeScore('j',1)">
      <span class="btn-label">+1</span>
      <span class="btn-sub">Tor</span>
    </button>
    <button class="btn-goal minus" onclick="changeScore('j',-1)">
      <span class="btn-label">−1</span>
      <span class="btn-sub">Korrektur</span>
    </button>
  </div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-cell">
    <span class="stat-val" id="statWinsH" style="color:var(--h)">0</span>
    <span class="stat-label">Siege H</span>
  </div>
  <div class="stat-cell">
    <span class="stat-val neutral" id="statGames">0</span>
    <span class="stat-label">Partien</span>
  </div>
  <div class="stat-cell">
    <span class="stat-val" id="statWinsJ" style="color:var(--j)">0</span>
    <span class="stat-label">Siege J</span>
  </div>
</div>

<!-- ACTIONS -->
<div class="actions">
  <button class="act-btn gold" onclick="saveGame()">Speichern</button>
  <button class="act-btn"     onclick="resetScore()">Neu</button>
  <button class="act-btn"     onclick="clearHistory()">Löschen</button>
</div>

<!-- HISTORY -->
<button class="hist-toggle" id="histToggle" onclick="toggleHist()">
  Verlauf
  <i class="hist-arrow">▾</i>
</button>
<div class="hist-panel" id="histPanel">
  <div class="hist-empty" id="histEmpty">Noch keine Partien.</div>
</div>


<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ── CONFIG ── */
const FB = {
  apiKey:            "AIzaSyBu5PrwcxOErX46y1CskANyEbVJNSqBrzI",
  authDomain:        "kicker-41854.firebaseapp.com",
  databaseURL:       "https://kicker-41854-default-rtdb.firebaseio.com",
  projectId:         "kicker-41854",
  storageBucket:     "kicker-41854.firebasestorage.app",
  messagingSenderId: "634456262042",
  appId:             "1:634456262042:web:15110a3de7fbeb10782623",
};
const db = getDatabase(initializeApp(FB));
const scoreRef   = ref(db, "score");
const historyRef = ref(db, "history");

/* ── STATE ── */
let state = { h: 0, j: 0 };
let history = {};

/* ── DOM ── */
const $ = id => document.getElementById(id);
const scoreHEl = $("scoreH"), scoreJEl = $("scoreJ");
const pipHEl   = $("pipH"),   pipJEl   = $("pipJ");
const leadFill = $("leadFill"), leadText = $("leadText");
const statWH   = $("statWinsH"), statWJ = $("statWinsJ"), statGm = $("statGames");
const dot      = $("dot"), connLabel = $("connLabel");
const histPanel = $("histPanel"), histToggle = $("histToggle"), histEmpty = $("histEmpty");

const toastEl  = $("toast");

/* ═══════════════════════════════════
   BACKGROUND PARTICLE CANVAS
═══════════════════════════════════ */
(function initBg() {
  const cv = $("bgCanvas");
  const ctx = cv.getContext("2d");
  let W, H, particles = [];

  function resize() {
    W = cv.width  = innerWidth;
    H = cv.height = innerHeight;
  }

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.r  = Math.random() * 1.4 + .4;
      this.vx = (Math.random() - .5) * .18;
      this.vy = (Math.random() - .5) * .18;
      this.a  = Math.random() * .35 + .05;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${this.a})`;
      ctx.fill();
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    }
  }

  function init() {
    resize();
    particles = Array.from({ length: 80 }, () => new Particle());
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  init(); loop();
})();

/* ═══════════════════════════════════
   RIPPLE CANVAS (per side)
═══════════════════════════════════ */
function makeRipple(canvasId, color) {
  const cv  = $(canvasId);
  const ctx = cv.getContext("2d");
  let rings = [];

  function resize() {
    cv.width  = cv.offsetWidth;
    cv.height = cv.offsetHeight;
  }

  function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    rings = rings.filter(r => r.a > .01);
    rings.forEach(r => {
      r.radius += 3.5;
      r.a *= .93;
      ctx.beginPath();
      ctx.arc(cv.width / 2, cv.height * .55, r.radius, 0, Math.PI * 2);
      ctx.strokeStyle = color.replace(")", `,${r.a})`).replace("rgb", "rgba");
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    requestAnimationFrame(loop);
  }

  new ResizeObserver(resize).observe(cv);
  resize(); loop();

  return function trigger() {
    rings.push({ radius: 20, a: .7 });
  };
}

const triggerRippleH = makeRipple("rippleH", "rgb(61,127,255)");
const triggerRippleJ = makeRipple("rippleJ", "rgb(255,61,61)");

/* ═══════════════════════════════════
   SCORE FLIP ANIMATION
═══════════════════════════════════ */
function flipScore(el, newVal) {
  const cur = el.textContent;
  if (cur === String(newVal)) return;
  el.classList.remove("flip-in", "flip-out");
  void el.offsetWidth;
  el.classList.add("flip-out");
  setTimeout(() => {
    el.textContent = newVal;
    el.classList.remove("flip-out");
    el.classList.add("flip-in");
    setTimeout(() => el.classList.remove("flip-in"), 150);
  }, 120);
}

/* ═══════════════════════════════════
   LEAD BAR
═══════════════════════════════════ */
function updateLeadBar(s) {
  leadText.textContent = s.h + " : " + s.j;
  const total = Math.max(s.h + s.j, 1);
  if (s.h === s.j) {
    leadFill.style.left  = "50%";
    leadFill.style.right = "50%";
    leadFill.style.background = "var(--rim)";
  } else if (s.h > s.j) {
    const pct = (s.h / (s.h + s.j)) * 100;
    leadFill.style.left  = "0%";
    leadFill.style.right = (100 - pct) + "%";
    leadFill.style.background = "var(--h)";
  } else {
    const pct = (s.j / (s.h + s.j)) * 100;
    leadFill.style.right = "0%";
    leadFill.style.left  = (100 - pct) + "%";
    leadFill.style.background = "var(--j)";
  }
}

/* ═══════════════════════════════════
   PIPS
═══════════════════════════════════ */
function renderPips(el, count) {
  el.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const d = document.createElement("div");
    d.className = "pip active";
    el.appendChild(d);
  }
}

/* ═══════════════════════════════════
   STATS
═══════════════════════════════════ */
function updateStats() {
  const entries = Object.values(history);
  const total = entries.length;
  const wH = entries.filter(e => e.winner === "h").length;
  const wJ = entries.filter(e => e.winner === "j").length;
  statWH.textContent = wH;
  statWJ.textContent = wJ;
  statGm.textContent = total;
}

/* ═══════════════════════════════════
   FIREBASE LISTENERS
═══════════════════════════════════ */
onValue(ref(db, ".info/connected"), snap => {
  const ok = snap.val();
  dot.className   = "dot " + (ok ? "live" : "offline");
  connLabel.textContent = ok ? "live" : "offline";
});

onValue(scoreRef, snap => {
  const v = snap.val() || { h: 0, j: 0 };
  const prevH = state.h, prevJ = state.j;
  state = v;
  flipScore(scoreHEl, v.h);
  flipScore(scoreJEl, v.j);
  renderPips(pipHEl, v.h);
  renderPips(pipJEl, v.j);
  updateLeadBar(v);
  if (v.h > prevH) triggerRippleH();
  if (v.j > prevJ) triggerRippleJ();
});

onValue(historyRef, snap => {
  history = snap.val() || {};
  updateStats();
  renderHistory();
});

/* ═══════════════════════════════════
   GAME LOGIC
═══════════════════════════════════ */
window.changeScore = function(player, delta) {
  const next = Math.max(0, state[player] + delta);
  if (next === state[player]) return;
  state[player] = next;
  if (navigator.vibrate) navigator.vibrate(delta > 0 ? [18] : [8, 40, 8]);
  set(scoreRef, state);
};


window.saveGame = function(silent) {
  if (state.h === 0 && state.j === 0) { showToast("Score ist 0:0."); return; }
  const id = Date.now().toString();
  const winner = state.h > state.j ? "h" : state.j > state.h ? "j" : "draw";
  set(ref(db, "history/" + id), {
    h: state.h, j: state.j, winner,
    ts: new Date().toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })
  });
  if (!silent) showToast("Gespeichert.");
  resetScore(true);
};

window.resetScore = function(silent) {
  winHandled = false;
  set(scoreRef, { h: 0, j: 0 });
  if (!silent) showToast("Neues Spiel.");
};

window.clearHistory = function() {
  if (!confirm("Gesamten Verlauf löschen?")) return;
  set(historyRef, null);
  showToast("Verlauf gelöscht.");
};



window.toggleHist = function() {
  const open = histPanel.classList.toggle("open");
  histToggle.classList.toggle("open", open);
};

/* ═══════════════════════════════════
   HISTORY RENDER
═══════════════════════════════════ */
function renderHistory() {
  while (histPanel.children.length > 1) histPanel.removeChild(histPanel.lastChild);
  const entries = Object.entries(history).sort((a, b) => b[0] - a[0]);
  if (!entries.length) { histEmpty.style.display = ""; return; }
  histEmpty.style.display = "none";
  entries.forEach(([, e]) => {
    const row = document.createElement("div");
    row.className = "hist-row";
    const wLabel = e.winner === "h" ? "Hendrik" : e.winner === "j" ? "Jakob" : "Unentschieden";
    row.innerHTML = `
      <span class="hist-score-text">${e.h} : ${e.j}</span>
      <span class="hist-win ${e.winner}">${wLabel}</span>
      <span class="hist-time-text">${e.ts}</span>`;
    histPanel.appendChild(row);
  });
}


/* ═══════════════════════════════════
   TOAST
═══════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
}
</script>
</body>
</html>
